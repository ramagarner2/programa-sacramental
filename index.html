<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa Sacramental — Rama Garner 2</title>
  <style>
    :root {
      --navy: #06182d;
      --gold: #d4a24d;
      --paper: #ffffff;
      --bg: #f4f2ee;
      --text: #111111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--paper);
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
      overflow: hidden;
    }

    .header {
      background: var(--navy);
      color: #ffffff;
      padding: 26px 22px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 500;
    }

    .body {
      padding: 24px 22px;
      text-align: center;
    }

    p {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.45;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin: 12px 0;
      border-radius: 999px;
      background: var(--navy);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.2;
    }

    .button.secondary {
      background: #eeeeee;
      color: #111111;
    }

    .note {
      margin-top: 16px;
      color: #555555;
      font-size: 13px;
      line-height: 1.35;
    }
  </style>

  <script>
    (function () {
      var isSmallScreen = window.matchMedia("(max-width: 900px)").matches;
      var isPrintRequest = new URLSearchParams(window.location.search).get("print") === "1";

      if (isSmallScreen && !isPrintRequest) {
        window.location.replace("mobile.html");
      }
    })();
  </script>
</head>

<body>
  <main class="card">
    <div class="header">
      <h1>Programa Sacramental<br>Rama Garner 2</h1>
    </div>

    <div class="body">
      <p>Seleccione cómo desea ver el programa.</p>

      <a class="button" href="mobile.html">Ver programa móvil</a>
      <a class="button secondary" href="program_print.html">Abrir versión para imprimir</a>

      <p class="note">
        En teléfono, esta página abre automáticamente la versión móvil.
      </p>
    </div>
  </main>
</body>
</html>
