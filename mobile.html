<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Rama Garner 2 — Programa e invitación</title>
  <link rel="icon" type="image/x-icon" href="images/favicons/favicon.ico">
  <meta name="theme-color" content="#f7f1e3">
  <style>
    :root {
      --background: #f7f1e3;
      --card: #fffaf0;
      --ink: #2d2418;
      --muted: #6b5f4e;
      --accent: #8a5a2b;
      --accent-dark: #5c3515;
      --border: rgba(92, 53, 21, 0.2);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: 26px 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 18px 45px rgba(61, 41, 18, 0.14);
    }

    h1 { margin: 0 0 10px; color: var(--accent-dark); font-size: 1.8rem; }
    p { margin: 8px 0 18px; color: var(--muted); line-height: 1.45; }
    .links { display: grid; gap: 10px; }

    .button {
      display: block;
      padding: 13px 16px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }

    .button.secondary {
      border-color: var(--border);
      background: transparent;
      color: var(--accent-dark);
    }

    #diagnostic { margin-top: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Rama Garner 2</h1>
    <p id="status">Abriendo la página correcta…</p>
    <div class="links">
      <a class="button" id="recommended" href="sunday.html">Abrir página recomendada</a>
      <a class="button secondary" href="sunday.html">Abrir programa sacramental</a>
      <a class="button secondary" href="invite.html">Abrir invitación</a>
    </div>
    <p id="diagnostic" hidden></p>
    <noscript><p>JavaScript está desactivado. Use uno de los enlaces visibles.</p></noscript>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var requestedMode = String(params.get('mode') || '').trim().toLowerCase();
      var debug = params.get('debug') === '1';
      var weekday;

      try {
        weekday = new Intl.DateTimeFormat('en-US', {
          weekday: 'long',
          timeZone: 'America/New_York'
        }).format(new Date());
      } catch (error) {
        weekday = new Date().toLocaleDateString('en-US', { weekday: 'long' });
      }

      var target;
      if (requestedMode === 'program' || requestedMode === 'sunday') {
        target = 'sunday.html';
      } else if (requestedMode === 'invite' || requestedMode === 'invitation') {
        target = 'invite.html';
      } else {
        target = weekday === 'Sunday' ? 'sunday.html' : 'invite.html';
      }

      var recommended = document.getElementById('recommended');
      recommended.href = target;
      recommended.textContent = target === 'sunday.html'
        ? 'Abrir programa sacramental'
        : 'Abrir invitación';

      if (debug) {
        document.getElementById('status').textContent = 'Modo de prueba: no se redirigió automáticamente.';
        var diagnostic = document.getElementById('diagnostic');
        diagnostic.hidden = false;
        diagnostic.textContent = 'Día en America/New_York: ' + weekday + ' · Destino: ' + target;
        return;
      }

      // Direct navigation avoids fetched-document injection and preserves visible fallbacks
      // if navigation is blocked or JavaScript fails before this point.
      window.setTimeout(function () {
        window.location.replace(target);
      }, 100);
    })();
  </script>
</body>
</html>
