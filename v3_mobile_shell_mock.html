<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rama Garner 2 — Smart Mobile Mock</title>

  <link rel="icon" type="image/x-icon" href="images/favicons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicons/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicons/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/favicons/android-chrome-512x512.png">
  <meta name="msapplication-TileImage" content="images/favicons/mstile-150x150.png">
  <meta name="theme-color" content="#f7f1e3">

  <style>
    :root {
      --bg: #f7f1e3;
      --card: #fffaf0;
      --ink: #2d2418;
      --muted: #6b5f4e;
      --accent: #8a5a2b;
      --accent-dark: #5c3515;
      --border: rgba(92, 53, 21, .18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #fff8e8 0%, var(--bg) 42%, #eadfc6 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(92vw, 520px);
      background: rgba(255, 250, 240, .94);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(61, 41, 18, .18);
      padding: 26px 22px;
      text-align: center;
    }

    .kicker {
      color: var(--accent-dark);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--accent-dark);
      font-size: clamp(1.7rem, 7vw, 2.4rem);
      line-height: 1.05;
    }

    p {
      margin: 8px auto;
      color: var(--muted);
      line-height: 1.45;
      max-width: 34rem;
    }

    .status {
      margin-top: 16px;
      text-align: left;
      background: rgba(255,255,255,.64);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      font-size: .95rem;
    }

    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 13px 16px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .button.secondary {
      background: rgba(138, 90, 43, .12);
      color: var(--accent-dark);
      border: 1px solid var(--border);
    }

    .error {
      color: #8a1f11;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="kicker">Rama Garner 2</div>
    <h1>Un momento por favor</h1>
    <p id="message">Estamos preparando la página correcta.</p>

    <div class="status" id="debugBox" hidden>
      <p><strong>Modo:</strong> <span id="modeText"></span></p>
      <p><strong>Día detectado:</strong> <span id="dayText"></span></p>
      <p><strong>Archivo que se cargará:</strong> <span id="targetText"></span></p>
      <p><strong>URL guardable:</strong> esta página permanece en la barra del navegador.</p>
    </div>

    <div class="buttons" id="buttons" hidden>
      <button class="button" id="loadButton" type="button">Cargar página recomendada</button>
      <a class="button secondary" href="v3_mobile_shell_mock.html?mode=invite&debug=1">Probar invitación</a>
      <a class="button secondary" href="v3_mobile_shell_mock.html?mode=program&debug=1">Probar programa</a>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var mode = String(params.get('mode') || '').toLowerCase();
      var debug = params.get('debug') === '1';

      var easternDate = new Date(new Date().toLocaleString('en-US', {
        timeZone: 'America/New_York'
      }));

      var weekday = easternDate.getDay();
      var weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

      var target;
      var resolvedMode;

      if (mode === 'program' || mode === 'sunday') {
        target = 'sunday.html';
        resolvedMode = 'Forced Program';
      } else if (mode === 'invite' || mode === 'invitation') {
        target = 'invite.html';
        resolvedMode = 'Forced Invite';
      } else if (weekday === 0) {
        target = 'sunday.html';
        resolvedMode = 'Auto Sunday';
      } else {
        target = 'invite.html';
        resolvedMode = 'Auto Weekday';
      }

      function targetWithCacheBuster() {
        var glue = target.indexOf('?') === -1 ? '?' : '&';
        return target + glue + 'shell=' + encodeURIComponent(Date.now());
      }

      function loadTarget() {
        document.getElementById('message').textContent = 'Cargando…';

        fetch(targetWithCacheBuster(), {
          cache: 'no-store'
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('No se pudo cargar ' + target + '. Error ' + response.status + '.');
            }
            return response.text();
          })
          .then(function (html) {
            // This keeps the current URL in the address bar while replacing the document
            // with the selected page. It is intentionally used only in this mock test.
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function (err) {
            document.getElementById('message').innerHTML =
              '<span class="error">No se pudo cargar la página automáticamente.</span>';
            document.getElementById('buttons').hidden = false;
            document.getElementById('loadButton').textContent = 'Intentar otra vez';
            document.getElementById('loadButton').onclick = loadTarget;

            var fallback = document.createElement('a');
            fallback.className = 'button secondary';
            fallback.href = target;
            fallback.textContent = 'Abrir directamente: ' + target;
            document.getElementById('buttons').appendChild(fallback);

            console.error(err);
          });
      }

      if (debug) {
        document.getElementById('debugBox').hidden = false;
        document.getElementById('buttons').hidden = false;
        document.getElementById('modeText').textContent = resolvedMode;
        document.getElementById('dayText').textContent = weekdayNames[weekday];
        document.getElementById('targetText').textContent = target;
        document.getElementById('loadButton').onclick = loadTarget;
      } else {
        loadTarget();
      }
    })();
  </script>
</body>
</html>
